<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bluversea Akıllı Asistan</title>
    
    <!-- CSS MAKYAJ KISMI BURADA BAŞLIYOR -->
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Helvetica, Arial, sans-serif;
            background-color: #000000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 24px;
            color: #F2F2F3;
            -webkit-font-smoothing: antialiased;
        }

        .chat-container {
            width: 420px;
            max-width: 100%;
            height: 640px;
            max-height: 100%;
            background: #000000;
            border: 1px solid #1C1C1E;
            border-radius: 26px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* ÜST BAR: sol hamburger menü, sağ yeni sohbet butonu */
        .top-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 14px;
            flex-shrink: 0;
        }

        .icon-btn {
            background: transparent;
            border: none;
            color: #E8E8EA;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background-color 0.2s ease;
            padding: 0;
        }

        .icon-btn:hover {
            background: rgba(255,255,255,0.08);
        }

        .chat-box {
            flex: 1;
            padding: 8px 18px 18px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 14px;
            background-color: #000000;
        }

        /* KARŞILAMA EKRANI: logo + hoş geldin metni. İlk mesaj gönderilince kaybolur,
           yeni sohbet başlatılınca tekrar görünür. */
        .welcome-screen {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            gap: 10px;
            padding: 24px;
            animation: slideUpFade 0.4s ease-out forwards;
        }

        .welcome-logo {
            width: 64px;
            height: 64px;
            border-radius: 18px;
            object-fit: cover;
            margin-bottom: 6px;
        }

        .welcome-title {
            font-size: 1.3rem;
            font-weight: 600;
            color: #F5F5F6;
        }

        .welcome-subtitle {
            font-size: 0.9rem;
            color: #8E8E93;
            max-width: 280px;
            line-height: 1.4;
        }

        @keyframes slideUpFade {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message {
            font-size: 0.95rem;
            line-height: 1.5;
            white-space: pre-wrap;
            word-wrap: break-word;
            animation: slideUpFade 0.3s ease-out forwards;
            max-width: 84%;
        }

        /* Kullanıcı mesajı: koyu gri kutu içinde beyaz yazı */
        .user-message {
            background: #26262A;
            color: #FFFFFF;
            align-self: flex-end;
            padding: 12px 16px;
            border-radius: 18px;
            border-bottom-right-radius: 6px;
        }

        /* Bluversea cevabı: kutusuz, düz metin */
        .bot-message {
            background: transparent;
            color: #E8E8EA;
            align-self: flex-start;
            padding: 2px 2px;
            max-width: 100%;
        }

        .typing-indicator {
            font-style: normal;
            color: #8E8E93;
            padding: 2px 2px !important;
            font-size: 0.9rem;
        }

        /* ALT KISIM: yüzen, yuvarlak giriş çubuğu */
        .input-area-wrapper {
            padding: 10px 14px 16px;
            flex-shrink: 0;
        }

        .input-area {
            display: flex;
            align-items: center;
            gap: 6px;
            background: #1C1C1E;
            border-radius: 30px;
            padding: 6px 6px 6px 14px;
        }

        .input-area input {
            flex: 1;
            border: none;
            outline: none;
            background: transparent;
            font-size: 0.95rem;
            color: #F2F2F3;
            padding: 10px 4px;
        }

        .input-area input::placeholder {
            color: #8E8E93;
        }

        .input-area .icon-btn-small {
            background: transparent;
            border: none;
            color: #C7C7CC;
            width: 34px;
            height: 34px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            flex-shrink: 0;
            transition: background-color 0.2s ease;
            padding: 0;
        }

        .input-area .icon-btn-small:hover {
            background: rgba(255,255,255,0.08);
        }

        /* Gönder butonu: yukarı ok, yakışan orta ton mavi */
        .send-btn {
            background: #3B7DF5;
            border: none;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            flex-shrink: 0;
            transition: background-color 0.2s ease, transform 0.15s ease;
        }

        .send-btn:hover {
            background: #4C89FF;
            transform: scale(1.04);
        }

        .send-btn:active {
            transform: scale(0.96);
        }

        /* ===================================================
           MOBİL UYUMLULUK (RESPONSIVE)
           480px ve altındaki ekranlarda (telefonlar) devreye girer
           =================================================== */
        @media (max-width: 480px) {
            body {
                padding: 0;
                align-items: stretch;
                justify-content: flex-start;
            }

            .chat-container {
                width: 100%;
                max-width: 100%;
                height: 100vh;
                border-radius: 0;
                border: none;
                box-shadow: none;
            }

            .message {
                max-width: 88%;
                font-size: 0.92rem;
            }

            .welcome-title {
                font-size: 1.15rem;
            }
        }

        /* Çok küçük ekranlar (eski/küçük telefonlar) */
        @media (max-width: 360px) {
            .message {
                font-size: 0.88rem;
            }

            .input-area input {
                font-size: 0.88rem;
            }
        }
    </style>
</head>
<body>

    <div class="chat-container">
        <div class="top-bar">

                        <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
                        <line x1="12" y1="19" x2="12" y2="23"></line>
                        <line x1="8" y1="23" x2="16" y2="23"></line>

                </button>
                <button class="send-btn" onclick="sendMessage()" aria-label="Gönder">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">

                        <polyline points="5 12 12 5 19 12"></polyline>
                    </svg>
                </button>
            </div>
        </div>
    </div>

    <!-- JAVASCRIPT ZEKA KISMI BURADA BAŞLIYOR -->
    <script>

      // =========================================================
      // FUTBOL ŞAMPİYONLARI VERİTABANI (Son 10 yıl + 2025-26 sezonu)
      // Not: Anahtar olarak sezonun BİTİŞ yılı kullanılıyor
      // (örn: 2015-16 sezonu -> 2016 anahtarı altında saklanıyor)
      // =========================================================

      // ESNEK EŞLEŞTİRME YARDIMCISI
      // Bu fonksiyon bir metindeki TÜM boşlukları kaldırır.
      // "la liga" ve "laliga" gibi yazımların ikisini de yakalayabilmek için kullanılır.
      // Tüm konularda (yemek, film, uzay, futbol vb.) bu sayede boşluk farkı sorun olmaz.
      function bosluksuz(str) {
          return str.replace(/\s+/g, '');
      }

      // KISA ANAHTAR KELİME KORUMASI
      // "hi", "js", "pc" gibi 3 harf ve altı kelimeler ham alt-metin (substring) olarak aranırsa
      // "something" (i.çinde "hi" var) gibi alakasız kelimelerin içinde yanlışlıkla bulunabilir.
      // Bu yüzden kısa kelimelerde her zaman TAM KELİME (word-boundary) eşleşmesi aranır.
      function anahtarMetindeVarMi(orijinalMetin, metinBosluksuz, anahtarKelime, anahtarBosluksuz, toleransUygula) {
          if (anahtarBosluksuz.length <= 3) {
              const kacisli = anahtarKelime.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
              const desen = new RegExp('(^|[^a-zA-ZçğıöşüÇĞİÖŞÜ0-9])' + kacisli + '($|[^a-zA-ZçğıöşüÇĞİÖŞÜ0-9])', 'i');
              return desen.test(orijinalMetin);
          }
          if (metinBosluksuz.includes(anahtarBosluksuz)) return true;
          if (toleransUygula) return esnekIcerir(metinBosluksuz, anahtarBosluksuz);
          return false;
      }

      // İKİ METİN ARASINDAKİ "DÜZENLEME MESAFESİNİ" (Levenshtein Distance) HESAPLAR
      // Örnek: "seria" ile "serie" arasında sadece 1 harf farkı var (mesafe = 1)
      function levenshteinMesafe(a, b) {
          const m = a.length, n = b.length;
          const dp = Array.from({ length: m + 1 }, () => new Array(n + 1).fill(0));
          for (let i = 0; i <= m; i++) dp[i][0] = i;
          for (let j = 0; j <= n; j++) dp[0][j] = j;
          for (let i = 1; i <= m; i++) {
              for (let j = 1; j <= n; j++) {
                  if (a[i - 1] === b[j - 1]) {
                      dp[i][j] = dp[i - 1][j - 1];
                  } else {
                      dp[i][j] = 1 + Math.min(dp[i - 1][j], dp[i][j - 1], dp[i - 1][j - 1]);
                  }
              }
          }
          return dp[m][n];
      }

      // YAZIM HATASINA TOLERANSLI ARAMA
      // Bir metnin içinde, anahtar kelimeye ÇOK YAKIN (birkaç harf farklı) bir parça olup olmadığını kontrol eder.
      // Bu sayede "seriaa", "seria a", "serie a" gibi TÜM yazım varyasyonları aynı konuya bağlanır.
      // Kısa kelimelerde (4 harf ve altı) tolerans uygulanmaz; aksi halde "js", "pc" gibi kelimeler
      // alakasız kelimelerle yanlışlıkla eşleşebilir.
      function esnekIcerir(metin, anahtar) {
          if (metin.includes(anahtar)) return true; // Önce hızlı ve kesin kontrol
          if (anahtar.length <= 4) return false;

          const tolerans = anahtar.length <= 8 ? 1 : 2;

          for (let fark = -tolerans; fark <= tolerans; fark++) {
              const pencereUzunlugu = anahtar.length + fark;
              if (pencereUzunlugu < 3) continue;
              for (let i = 0; i <= metin.length - pencereUzunlugu; i++) {
                  const pencere = metin.substr(i, pencereUzunlugu);
                  if (levenshteinMesafe(pencere, anahtar) <= tolerans) {
                      return true;
                  }
              }
          }
          return false;
      }

      // DİL TESPİTİ (Basit, ücretsiz, tamamen yerel - hiçbir dış servise bağlanmaz)
      // Türkçe'ye özgü harfler veya yaygın Türkçe kelimeler varsa Türkçe;
      // yaygın İngilizce kelimeler ağır basıyorsa İngilizce kabul edilir.
      function dilTespitEt(text) {
          const turkceKarakterler = /[çğıöşüÇĞİÖŞÜ]/;
          if (turkceKarakterler.test(text)) return 'tr';

          const turkceKelimeler = ["nedir","nasıl","mısın","musun","selam","merhaba","istiyorum","ver","söyle","kaç","hangi","için","bir","bu","şu","ne","kim","yap","olur","mu","mi"];
          const ingilizceKelimeler = ["what","how","who","when","where","why","please","hello","hi","hey","can","you","the","is","are","recipe","give","tell","code","movie","show","recommend","want","need","thanks","thank"];

          const kelimeler = text.toLowerCase().split(/\s+/);
          let trPuan = 0, enPuan = 0;
          for (const k of kelimeler) {
              if (turkceKelimeler.includes(k)) trPuan++;
              if (ingilizceKelimeler.includes(k)) enPuan++;
          }
          if (enPuan > trPuan) return 'en';
          return 'tr'; // Belirsizse varsayılan Türkçe
      }

      // NETLEŞTİRME SORUSU DURUM MAKİNESİ
      // Claude'un yaptığı gibi: bazı konularda direkt cevap vermek yerine önce
      // kullanıcıya soru sorup ona göre daha isabetli bir cevap veriyoruz.
      // "Gerektiği yerde" kullanılır - her konuda değil, sadece burada tanımlı olanlarda.
      let bekleyenSoru = null;

      const netlestirmeYapilandirmasi = {
          web_sitesi_turu: {
              tetikleyiciler: ["web sitesi yapmak istiyorum", "web sitesi", "site kur", "web site yapmak"],
              soru: `Ne tür bir web sitesi yapmak istiyorsun?

1. Kişisel blog / hobi sayfası
2. Küçük işletme / kurumsal tanıtım sitesi
3. Basit "Merhaba Dünya" örneği yeterli

Numarayla cevap verebilirsin, ya da kendi fikrini de yazabilirsin:

`,
              cevapVer: function (kullaniciCevabi) {
                  const c = kullaniciCevabi.toLocaleLowerCase('tr-TR');
                  if (c.includes('1') || c.includes('blog') || c.includes('hobi')) {
                      return `Blog / hobi sayfası için örnek kod - kopyalayıp 'index.html' olarak kaydet ve çift tıkla:

<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Blogum</title>
</head>
<body>
    <h1>Benim Blogum</h1>
    <article>
        <h2>İlk Yazım</h2>
        <p>Bugün blog yazmaya başladım!</p>
        <small>7 Eylül 2026</small>
    </article>
</body>
</html>`;
                  } else if (c.includes('2') || c.includes('işletme') || c.includes('kurumsal') || c.includes('şirket')) {
                      return `Küçük işletme sitesi için örnek kod - kopyalayıp 'index.html' olarak kaydet ve çift tıkla:

<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>İşletmem</title>
</head>
<body>
    <header>
        <h1>Firma Adım</h1>
        <p>Kaliteli hizmet, uygun fiyat.</p>
    </header>
    <section>
        <h2>Hizmetlerimiz</h2>
        <ul>
            <li>Hizmet 1</li>
            <li>Hizmet 2</li>
        </ul>
    </section>
    <footer>
        <p>İletişim: info@firmam.com</p>
    </footer>
</body>
</html>`;
                  }
                  return `Basit örnek kod - kopyalayıp 'index.html' olarak kaydet ve çift tıkla:

<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>İlk Sitem</title>
</head>
<body>
    <h1>Merhaba Dünya!</h1>
    <p>Bu benim kendi yaptığım ilk web sitem.</p>
</body>
</html>`;
              }
          },
          film_turu: {
              tetikleyiciler: ["film öner", "film önerisi"],
              soru: `Hangi türde film arıyorsun?

1. Aksiyon
2. Bilim kurgu
3. Dram
4. Komedi
5. Korku
6. Hepsini görmek istiyorum

Numarayla cevap verebilirsin, ya da kendi fikrini de yazabilirsin:

`,
              cevapVer: function (kullaniciCevabi) {
                  const c = kullaniciCevabi.toLocaleLowerCase('tr-TR');
                  if (c.includes('1') || c.includes('aksiyon')) return "Aksiyon Film Önerileri:\n- Mad Max: Fury Road\n- John Wick\n- Dark Knight";
                  if (c.includes('2') || c.includes('bilim kurgu')) return "Bilim Kurgu Film Önerileri:\n- Interstellar\n- Inception\n- Blade Runner 2049";
                  if (c.includes('3') || c.includes('dram')) return "Dram Film Önerileri:\n- Yeşil Yol (The Green Mile)\n- Forrest Gump\n- Şawshank Redemption";
                  if (c.includes('4') || c.includes('komedi')) return "Komedi Film Önerileri:\n- Kaptan Bulgur\n- Süper Lig\n- Hababam Sınıfı";
                  if (c.includes('5') || c.includes('korku')) return "Korku Film Önerileri:\n- Aramızda\n- Sinsi\n- Şeytan Tüyü";
                  return cevapHavuzu["film öner"];
              }
          },
          dizi_turu: {
              tetikleyiciler: ["dizi öner", "dizi önerisi"],
              soru: `Hangi türde dizi arıyorsun?

1. Dram
2. Bilim kurgu / Fantastik
3. Suç / Gerilim
4. Komedi
5. Tarihi
6. Hepsini görmek istiyorum

Numarayla cevap verebilirsin, ya da kendi fikrini de yazabilirsin:

`,
              cevapVer: function (kullaniciCevabi) {
                  const c = kullaniciCevabi.toLocaleLowerCase('tr-TR');
                  if (c.includes('1') || c.includes('dram')) return "Dram Dizi Önerileri:\n- Ezel\n- Kızıl Elma\n- Breaking Bad";
                  if (c.includes('2') || c.includes('bilim kurgu') || c.includes('fantastik')) return "Bilim Kurgu / Fantastik Dizi Önerileri:\n- Stranger Things\n- Dark\n- Game of Thrones";
                  if (c.includes('3') || c.includes('suç') || c.includes('gerilim')) return "Suç/Gerilim Dizi Önerileri:\n- Money Heist (La Casa de Papel)\n- Mindhunter";
                  if (c.includes('4') || c.includes('komedi')) return "Komedi Dizi Önerileri:\n- Brooklyn Nine-Nine\n- Friends";
                  if (c.includes('5') || c.includes('tarih')) return "Tarihi Dizi Önerileri:\n- Diriliş Ertuğrul\n- Vikings";
                  return cevapHavuzu["dizi öner"];
              }
          }
      };

      // FUTBOL ŞAMPİYONLARI VERİTABANI (Son 10 yıl + 2025-26 sezonu)
      // Not: Anahtar olarak sezonun BİTİŞ yılı kullanılıyor
      // (örn: 2015-16 sezonu -> 2016 anahtarı altında saklanıyor)
      // =========================================================
      const futbolSampiyonlari = {
    "süper lig": {
        aliases: ["süper lig", "süperlig", "türkiye ligi"],
        sampiyonlar: {
            2016: "Beşiktaş", 2017: "Beşiktaş", 2018: "Galatasaray", 2019: "Galatasaray",
            2020: "İstanbul Başakşehir", 2021: "Beşiktaş", 2022: "Trabzonspor",
            2023: "Galatasaray", 2024: "Galatasaray", 2025: "Galatasaray", 2026: "Galatasaray"
        }
    },
    "premier lig": {
        aliases: ["premier lig", "premier league", "ingiltere ligi"],
        sampiyonlar: {
            2016: "Leicester City", 2017: "Chelsea", 2018: "Manchester City", 2019: "Manchester City",
            2020: "Liverpool", 2021: "Manchester City", 2022: "Manchester City",
            2023: "Manchester City", 2024: "Manchester City", 2025: "Liverpool"
        }
    },
    "la liga": {
        aliases: ["la liga", "ispanya ligi"],
        sampiyonlar: {
            2016: "Barcelona", 2017: "Real Madrid", 2018: "Barcelona", 2019: "Barcelona",
            2020: "Real Madrid", 2021: "Atletico Madrid", 2022: "Real Madrid",
            2023: "Barcelona", 2024: "Real Madrid", 2025: "Barcelona", 2026: "Barcelona"
        }
    },
    "serie a": {
        aliases: ["serie a", "italya ligi"],
        sampiyonlar: {
            2016: "Juventus", 2017: "Juventus", 2018: "Juventus", 2019: "Juventus",
            2020: "Juventus", 2021: "Inter", 2022: "AC Milan",
            2023: "Napoli", 2024: "Inter", 2025: "Napoli", 2026: "Inter"
        }
    },
    "bundesliga": {
        aliases: ["bundesliga", "almanya ligi"],
        sampiyonlar: {

function findFootballChampion(text, dil) {
    dil = dil || 'tr';
    const textBosluksuz = bosluksuz(text);
    let eslesenLig = null;
    let ligAdi = null;

    // 1. AŞAMA: Önce TAM eşleşme ara
    for (const key in futbolSampiyonlari) {
        const lig = futbolSampiyonlari[key];
        for (const alias of lig.aliases) {
            const aliasBosluksuz = bosluksuz(alias);
            if (textBosluksuz.includes(aliasBosluksuz)) {
                eslesenLig = lig;
                ligAdi = key;
                break;
            }
        }
        if (eslesenLig) break;
    }

    // 2. AŞAMA: Tam eşleşme yoksa, yazım hatasına toleranslı ara
    if (!eslesenLig) {
        for (const key in futbolSampiyonlari) {
            const lig = futbolSampiyonlari[key];
            for (const alias of lig.aliases) {
                const aliasBosluksuz = bosluksuz(alias);
                if (esnekIcerir(textBosluksuz, aliasBosluksuz)) {
                    eslesenLig = lig;
                    ligAdi = key;
                    break;
                }
            }
            if (eslesenLig) break;
        }
    }

    if (!eslesenLig) {
        // Lig ismi geçmiyor ama "şampiyon"/"champion" kelimesi varsa, netleştirici soru sor
        if (text.includes("şampiyon") || text.includes("sampiyon") || text.includes("champion")) {
            if (dil === 'en') {
                return `Which year and which league's champion are you curious about?

Leagues: Süper Lig (Turkey), Premier League, La Liga, Serie A, Bundesliga, Ligue 1, Champions League

Example: "2022 super lig champion" or "2020 premier league champion"`;
            }
            return `Hangi sene ve hangi ligin şampiyonunu merak ediyorsun?

Ligler: Süper Lig, Premier Lig, La Liga, Serie A, Bundesliga, Ligue 1, Şampiyonlar Ligi

Örnek: "2022 süper lig şampiyonu" veya "2020 premier lig şampiyonu"`;
        }
        return null; // Futbol sorusu değil
    }

    const yilEslesme = text.match(/\b(20[1-2][0-9])\b/);

    if (yilEslesme) {
        const yil = parseInt(yilEslesme[1]);
        const sampiyon = eslesenLig.sampiyonlar[yil];
        if (sampiyon) {
            if (dil === 'en') return `${ligAdi.toUpperCase()} champion in ${yil}: ${sampiyon}`;
            return `${yil} yılında ${ligAdi.toUpperCase()} şampiyonu: ${sampiyon}`;
        } else {
            if (dil === 'en') return `I don't have ${ligAdi} data for ${yil}. I only know champions from 2016 to 2026.`;
            return `${yil} yılı için elimde ${ligAdi} bilgisi yok. Sadece 2016-2026 arasındaki şampiyonları biliyorum.`;
        }
    } else {
        let liste = dil === 'en'
            ? `${ligAdi.toUpperCase()} - Champions of Recent Years:\n`
            : `${ligAdi.toUpperCase()} - Son Yılların Şampiyonları:\n`;
        for (const yil in eslesenLig.sampiyonlar) {
            liste += `${yil}: ${eslesenLig.sampiyonlar[yil]}\n`;
        }
        return liste;
    }
}

    "rust": `Rust nedir?
Rust daha modern bir dildir. Performans, sistem yazılımı, güvenlik (bellek güvenliği) ve blockchain alanlarında kullanılır. Ücretsiz mi? Evet.

Daha kapsamlı bir örnek - basit bir envanter yönetimi:

struct Urun {
    ad: String,
    stok: u32,
}

impl Urun {
    fn yeni(ad: &str, stok: u32) -> Urun {
        Urun { ad: ad.to_string(), stok }
    }

    fn stok_azalt(&mut self, miktar: u32) {
        if miktar > self.stok {
            println!("{} için yetersiz stok!", self.ad);
        } else {
            self.stok -= miktar;
            println!("{} stoktan {} adet düşüldü. Kalan: {}", self.ad, miktar, self.stok);
        }
    }
}

fn main() {
    let mut kalem = Urun::yeni("Kalem", 100);
    kalem.stok_azalt(30);

    // Rust'a özgü "ownership" (sahiplik) kavramı
    let metin1 = String::from("merhaba");
    let metin2 = metin1; // metin1'in sahipliği metin2'ye geçti
    println!("{}", metin2); // Bu satır çalışır
    // println!("{}", metin1); // Bu satır HATA verirdi çünkü metin1 artık geçersiz
}

Ownership (sahiplik) sistemi, Rust'ı bellek hatalarına karşı diğer dillerden çok daha güvenli yapan temel kavramdır - her değerin tek bir sahibi olur.`,

            "universe": `Universe Basics:
- The universe is believed to have begun with the Big Bang about 13.8 billion years ago.

- The observable universe is estimated to contain hundreds of billions of galaxies.

            "star": `About Stars:
- Stars are massive balls of gas that fuse hydrogen into helium in their cores.
- Our Sun is a medium-sized yellow star.
- A star's color depends on its temperature: blue stars are hottest, red stars are cooler.

            "coding": "Coding is how we tell computers what to do. Ask me about a specific language: HTML, CSS, JavaScript, Python, Java, C, C++, C#, Kotlin, Swift, Go, Rust, PHP, SQL, TypeScript.",
            "programming": "Coding is how we tell computers what to do. Ask me about a specific language: HTML, CSS, JavaScript, Python, Java, C, C++, C#, Kotlin, Swift, Go, Rust, PHP, SQL, TypeScript.",

            "html": `What is HTML?
HTML is the skeleton of a web page. It defines where the title, text, buttons, images, menus, forms, and tables go. The browser reads it and builds the page. It's not technically a "programming" language - it's a markup language. 100% free.

A more detailed example - a simple profile page:

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My Profile</title>
</head>
<body>
    <header>
        <h1>Hi, I'm Alex</h1>
        <p>Aspiring web developer.</p>
    </header>

    <nav>
        <a href="#about">About</a>
        <a href="#projects">Projects</a>
        <a href="#contact">Contact</a>
    </nav>

    <section id="about">
        <h2>About Me</h2>
        <p>I'm learning HTML, CSS, and JavaScript.</p>
        <img src="photo.jpg" alt="My profile photo" width="150">
    </section>

    <section id="projects">
        <h2>My Projects</h2>
        <ul>
            <li>Personal blog</li>
            <li>Simple calculator</li>
        </ul>
    </section>

    <section id="contact">
        <h2>Contact</h2>
        <form>
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>
            <button type="submit">Send</button>
        </form>
    </section>

    <footer>
        <p>&copy; 2026 Alex's Site</p>
    </footer>
</body>
</html>

<header>, <nav>, <section>, and <footer> are "semantic" tags - they describe what each part of the page is for, both to the browser and to other developers reading your code.`,

            "css": `What is CSS?
If HTML is the skeleton, CSS is the appearance. You use it to set colors, sizes, positioning, animations, responsiveness, and shadows. Free? Yes.

A more detailed example - a flexbox card layout with a hover effect:

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background-color: #f5f5f5;
}

.card-area {
    display: flex;
    flex-wrap: wrap;
    gap: 16px;
    justify-content: center;
    padding: 24px;
}

.card {
    background: white;
    border-radius: 12px;
    padding: 20px;
    width: 220px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    transition: transform 0.2s ease;
}

.card:hover {
    transform: translateY(-6px);
}

/* Stack cards vertically on small screens */
@media (max-width: 600px) {
    .card-area {
        flex-direction: column;
        align-items: center;
    }
}

The @media block is what's called "responsive design" - it automatically changes the layout when the screen gets smaller (like on a phone).`,

            "javascript": `What is JavaScript?
HTML: "There's a button on the page." CSS: "The button is blue." JavaScript: "What happens when you click it?" JavaScript is what makes a page interactive, does calculations, and responds to the user. With Node.js it can also run on a server. Free? Yes.

A more detailed example - a simple to-do list:

let todos = ["Go to the store", "Write code", "Read a book"];

function addTodo(newTodo) {
    todos.push(newTodo);
    console.log(newTodo + " added.");
}

function completeTodo(todo) {
    todos = todos.filter(function (t) {
        return t !== todo;
    });
}

function showList() {
    todos.forEach(function (todo, index) {
        console.log((index + 1) + ". " + todo);
    });
}

addTodo("Exercise");
completeTodo("Go to the store");
showList();

// A real example triggered by a button click (embedded in HTML):
// <button onclick="sayHello()">Click</button>
function sayHello() {
    alert("Hello! You clicked the button.");
}

push(), filter(), and forEach() are the functions you'll use most often when working with arrays.`,

            "python": `What is Python?
Python is one of the easiest popular languages to learn. You can do AI, machine learning, data analysis, bots, and automation with it. Completely free and open-source.

A more detailed example - a student grade average calculator:

students = {
    "Alice": [85, 90, 78],
    "Bob": [60, 70, 65],
    "Carla": [95, 92, 98]
}

def calculate_average(grades):
    return sum(grades) / len(grades)

def letter_grade(average):
    if average >= 85:
        return "A"
    elif average >= 70:
        return "B"
    elif average >= 50:
        return "C"
    else:
        return "F"

for name, grades in students.items():
    avg = calculate_average(grades)
    print(f"{name}: Average = {avg:.1f}, Grade = {letter_grade(avg)}")

class Student:
    def __init__(self, name, grades):
        self.name = name
        self.grades = grades

    def average(self):
        return sum(self.grades) / len(self.grades)

student1 = Student("Dan", [80, 88, 92])
print(f"{student1.name}'s average: {student1.average():.1f}")

Dictionaries, functions (def), loops (for), and classes (class) are the four building blocks you'll use most in Python.`,

            "c language": `What is C?
C is old but still hugely important. It's used in operating systems, embedded systems, microcontrollers, and hardware-level programming. It teaches you how a computer really works (RAM, CPU, memory, pointers). Free? Yes.

A more detailed example - calculating the average of numbers:

#include <stdio.h>

float calculate_average(int arr[], int size) {
    int total = 0;
    for (int i = 0; i < size; i++) {
        total += arr[i];
    }
    return (float)total / size;
}

int main() {
    int grades[] = {85, 90, 78, 92, 60};
    int size = 5;

    float avg = calculate_average(grades, size);
    printf("Average: %.2f\\n", avg);

    // Pointer example - an important C-specific concept
    int number = 10;
    int *numberAddress = &number;
    printf("Value: %d\\n", *numberAddress);

    return 0;
}

Pointers hold the memory address of a variable - one of the concepts that sets C apart from many other languages.`,

            "c++": `What is C++?
C++ extends C with object-oriented features. It's used for games, game engines, performance-critical applications, and desktop software. It's one of the core technologies behind Unreal Engine. Free? Yes.

A more detailed example - a simple class:

#include <iostream>
#include <string>
using namespace std;

class Car {
private:
    string brand;
    int speed;

public:
    Car(string b) {
        brand = b;
        speed = 0;
    }

    void accelerate(int amount) {
        speed += amount;
        cout << brand << " is now going " << speed << " km/h." << endl;
    }

    void brake() {
        speed = 0;
        cout << brand << " has stopped." << endl;
    }
};

int main() {
    Car car1("Toyota");
    car1.accelerate(50);
    car1.accelerate(30);
    car1.brake();

    return 0;
}

Classes let you model real-world objects (a car, a user, a product) in code - the heart of object-oriented programming (OOP).`,

            "c#": `What is C#?
C# is especially popular in the Microsoft ecosystem: Windows apps, web, desktop software, and backend systems. It's also important for game development with Unity. Free? Yes.

A more detailed example - a simple inventory system:

using System;
using System.Collections.Generic;

class Product {
    public string Name { get; set; }
    public int Stock { get; set; }

    public Product(string name, int stock) {
        Name = name;
        Stock = stock;
    }

    public void ReduceStock(int amount) {
        if (amount > Stock) {
            Console.WriteLine("Not enough stock: " + Name);
        } else {
            Stock -= amount;
            Console.WriteLine(amount + " units of " + Name + " sold. Remaining: " + Stock);
        }
    }
}

class Program {
    static void Main() {
        List<Product> products = new List<Product> {
            new Product("Pen", 100),
            new Product("Notebook", 50)
        };

        foreach (Product p in products) {
            Console.WriteLine(p.Name + " - Stock: " + p.Stock);
        }

        products[0].ReduceStock(30);
    }
}

Generic collections like List<Product> are the standard way to work with groups of data in C#.`,

            "java": `What is Java?
Java has a huge ecosystem: Android apps, large enterprise software, banking systems, and backend development. Thanks to the Java Virtual Machine (JVM), it runs smoothly across different operating systems. Free? Yes.

A more detailed example - a simple bank account class:

import java.util.ArrayList;
import java.util.List;

class Transaction {
    String type;
    double amount;

    Transaction(String type, double amount) {
        this.type = type;
        this.amount = amount;
    }
}

class BankAccount {
    private double balance;
    private List<Transaction> transactions = new ArrayList<>();

    public void deposit(double amount) {
        balance += amount;
        transactions.add(new Transaction("Deposit", amount));
        System.out.println(amount + " deposited. New balance: " + balance);
    }

    public void withdraw(double amount) {
        if (amount > balance) {
            System.out.println("Insufficient funds!");
            return;
        }
        balance -= amount;
        transactions.add(new Transaction("Withdrawal", amount));
        System.out.println(amount + " withdrawn. New balance: " + balance);
    }
}

public class Main {
    public static void main(String[] args) {
        BankAccount account = new BankAccount();
        account.deposit(1000);
        account.withdraw(300);
    }
}

Every Java file contains at least one class, and the entry point of a program is always the main() method.`,

            "kotlin": `What is Kotlin?
Kotlin is especially important for Android - it's one of Google's officially recommended languages for Android development. Free? Yes.

A more detailed example - a simple task manager:

data class Task(val title: String, var done: Boolean = false)

fun main() {
    val tasks = mutableListOf(
        Task("Go shopping"),
        Task("Write code"),
        Task("Exercise")
    )

    tasks[1].done = true

    for (task in tasks) {
        val status = if (task.done) "✔" else "◻"
        println("$status \${task.title}")
    }

    val hour = 14
    val timeOfDay = when {
        hour < 6 -> "Night"
        hour < 12 -> "Morning"
        hour < 18 -> "Afternoon"

    }
    println("It's currently: $timeOfDay")

"data class" is a very handy Kotlin-specific feature - it lets you define simple data-holding classes in one line.`,

            "swift": `What is Swift?
Swift is the language Apple created for iPhone, iPad, Mac, and Apple Watch apps. The language itself is free.

A more detailed example - a simple shopping cart:

struct Product {
    var name: String
    var price: Double
}

struct Cart {
    var items: [Product] = []

    mutating func add(_ item: Product) {
        items.append(item)
        print("\\(item.name) added to cart.")
    }

    func total() -> Double {
        return items.reduce(0) { total, item in total + item.price }
    }
}

var myCart = Cart()
myCart.add(Product(name: "Headphones", price: 45.0))
myCart.add(Product(name: "Charging Cable", price: 9.0))

print("Total: \\(myCart.total())")

var username: String? = nil
if let name = username {
    print("Hello, \\(name)")
} else {
    print("No username entered.")
}

Optionals (String?) let you safely handle values that might or might not exist (nil) - one of Swift's biggest safety features.`,

            "golang": `What is Go (Golang)?
Go was created by Google. It's used for servers, backend systems, cloud infrastructure, networking, and large-scale systems. Free? Yes.

A more detailed example - a simple task list with a concurrency example:

package main

import "fmt"

type Task struct {
    Title string
    Done  bool
}

func printTasks(tasks []Task) {
    for i, t := range tasks {
        status := "◻"
        if t.Done {
            status = "✔"
        }
        fmt.Printf("%d. %s %s\\n", i+1, status, t.Title)
    }
}

func main() {
    tasks := []Task{
        {"Write code", false},
        {"Test it", false},
        {"Deploy", false},
    }

    tasks[0].Done = true
    printTasks(tasks)

    channel := make(chan string)
    go func() {
        channel <- "Background task finished!"
    }()
    fmt.Println(<-channel)
}

Goroutines (go func() {...}) are what make Go so popular for concurrent systems - you can run things in parallel with very little code.`,

            "rust": `What is Rust?
Rust is a more modern language, used for performance-critical software, systems programming, security (memory safety), and blockchain. Free? Yes.

A more detailed example - a simple inventory system:

struct Product {
    name: String,
    stock: u32,
}

impl Product {
    fn new(name: &str, stock: u32) -> Product {
        Product { name: name.to_string(), stock }
    }

    fn reduce_stock(&mut self, amount: u32) {
        if amount > self.stock {
            println!("Not enough stock for {}!", self.name);
        } else {
            self.stock -= amount;
            println!("{} units of {} sold. Remaining: {}", amount, self.name, self.stock);
        }
    }
}

fn main() {
    let mut pen = Product::new("Pen", 100);
    pen.reduce_stock(30);

    let text1 = String::from("hello");
    let text2 = text1; // ownership of text1 moves to text2
    println!("{}", text2); // this line works
    // println!("{}", text1); // this would ERROR - text1 is no longer valid
}

Ownership is the core concept that makes Rust much safer against memory bugs than most other languages - every value has exactly one owner.`,

            "php": `What is PHP?

            "sql": `What is SQL?
SQL isn't a programming language - it's a database query language. You use it to add, delete, update, and search data. Free (used with tools like MySQL, PostgreSQL, or SQLite).

More detailed examples - a "students" and "courses" database scenario:

CREATE TABLE students (
    id INT PRIMARY KEY,
    name VARCHAR(50),
    age INT
);

INSERT INTO students (id, name, age) VALUES (1, 'Alice', 20);
INSERT INTO students (id, name, age) VALUES (2, 'Bob', 22);

SELECT * FROM students;

SELECT name FROM students WHERE age > 20;

UPDATE students SET age = 21 WHERE name = 'Alice';

DELETE FROM students WHERE name = 'Bob';

SELECT students.name, courses.course_name
FROM students
JOIN courses ON students.id = courses.student_id;

JOIN lets you combine two different tables through a shared column - most real-world databases span multiple tables.`,

            "typescript": `What is TypeScript?
Think of TypeScript as JavaScript with extra safety rails. By declaring the types of your variables, it helps you catch mistakes while you're writing code, which is especially useful in large projects. Free? Yes.

A more detailed example - a type-safe product system:

interface Product {
    name: string;
    price: number;
    inStock: boolean;
}

function showPrice(product: Product): string {
    if (!product.inStock) {
        return product.name + " is currently out of stock.";
    }
    return product.name + ": $" + product.price;
}

const products: Product[] = [
    { name: "Headphones", price: 45, inStock: true },
    { name: "Keyboard", price: 30, inStock: false }
];

products.forEach(product => {
    console.log(showPrice(product));
});

// TypeScript WARNS you if you pass the wrong type (before the code even runs):
// showPrice({ name: "Mouse", price: "fifteen", inStock: true });
// ^ ERROR: price must be 'number', not 'string'

This "catch errors before running" feature is what makes TypeScript much safer than plain JavaScript as projects grow.`,

       function findAnswer(userText) {
    // 0. AŞAMA: Bekleyen bir netleştirme sorusu var mı? (dilden bağımsız, her şeyden önce kontrol edilir)
    if (bekleyenSoru !== null) {

        // Kullanıcının cevabı kısa ise (numara ya da birkaç kelime), bunu soruya cevap say.
        // Uzun/alakasız bir şey yazdıysa, soruyu unut ve mesajı normal şekilde işlemeye devam et.
        if (kelimeSayisi <= 8) {
            return netlestirmeYapilandirmasi[aktifSoru].cevapVer(userText);
        }
    }

    const dil = dilTespitEt(userText); // 'tr' veya 'en'
    let kucukHarfText = userText.toLocaleLowerCase(dil === 'en' ? 'en-US' : 'tr-TR');

    // YAZIYI RAKAMA ÇEVİREN SİHİRLİ SÖZLÜK (yalnızca Türkçe sayı kelimeleri için)
    function yaziyiRakamaCevir(metin) {
        const sozluk = {
            "sıfır":0, "bir":1, "iki":2, "üç":3, "dört":4, "beş":5, "altı":6, "yedi":7, "sekiz":8, "dokuz":9,
            "on":10, "yirmi":20, "otuz":30, "kırk":40, "elli":50, "altmış":60, "atmış":60, "yetmiş":70, "seksen":80, "doksan":90,
            "yüz":100, "bin":1000
        };
        
        let kelimeler = metin.trim().split(/\s+/);
        let sonucMetni = [];
        let aktifSayi = 0, geciciSayi = 0, sayiModu = false;
        
        for(let i=0; i<kelimeler.length; i++) {
            let kelime = kelimeler[i];
            if(sozluk[kelime] !== undefined) {
                sayiModu = true;
                let val = sozluk[kelime];
                if(val === 100) {
                    if(geciciSayi === 0) geciciSayi = 1;
                    geciciSayi *= 100;
                } else if (val === 1000) {
                    if(geciciSayi === 0) geciciSayi = 1;
                    geciciSayi *= 1000;
                    aktifSayi += geciciSayi;
                    geciciSayi = 0;
                } else {
                    geciciSayi += val;
                }
            } else {
                if(sayiModu) {
                    aktifSayi += geciciSayi;
                    sonucMetni.push(aktifSayi.toString());
                    aktifSayi = 0; geciciSayi = 0; sayiModu = false;
                }
                sonucMetni.push(kelime);
            }
        }
        if(sayiModu) {
            aktifSayi += geciciSayi;
            sonucMetni.push(aktifSayi.toString());
        }
        return sonucMetni.join(" ");
    }

    // 1. Önce yazıları rakama çevir
    let rakamliMetin = yaziyiRakamaCevir(kucukHarfText);

    // 2. Sonra kelime işlemleri sembollere çevir
    let islemMetni = rakamliMetin
        .replace(/artı/g, '+')
        .replace(/eksi/g, '-')
        .replace(/çarpı/g, '*')
        .replace(/x/g, '*')
        .replace(/bölü/g, '/')
        .replace(/,/g, '.');

    // MATEMATİK FİLTRESİ
    const matematikFiltresi = /^[0-9\+\-\*\/\.\s\(\)\%]+$/;
    if(matematikFiltresi.test(islemMetni) && /[0-9]/.test(islemMetni) && /[\+\-\*\/]/.test(islemMetni)) {
        try {
            const sonuc = Function('return ' + islemMetni)();
            if(isFinite(sonuc)) {
                return (dil === 'en' ? "Result: " : "Bu işlemin sonucu: ") + sonuc;
            }
        } catch (e) {}
    }

    // FUTBOL ŞAMPİYONU SORGUSU
    const futbolCevabi = findFootballChampion(kucukHarfText, dil);
    if (futbolCevabi) {
        return futbolCevabi;
    }

    // NETLEŞTİRME SORUSU TETİKLEYİCİLERİ (şu an sadece Türkçe konularda aktif)
    const kucukHarfTextBosluksuz = bosluksuz(kucukHarfText);
    if (dil === 'tr') {
        for (const anahtar in netlestirmeYapilandirmasi) {
            const yapilandirma = netlestirmeYapilandirmasi[anahtar];
            for (const tetik of yapilandirma.tetikleyiciler) {
                if (esnekIcerir(kucukHarfTextBosluksuz, bosluksuz(tetik))) {
                    bekleyenSoru = anahtar;
                    return yapilandirma.soru;
                }
            }
        }
    }

    // KELİME HAVUZUNU TARA (İKİ AŞAMALI ARAMA) - dile göre doğru havuzu seç
    const aktifHavuz = dil === 'en' ? cevapHavuzuEN : cevapHavuzu;

    // 1. AŞAMA: TAM eşleşen TÜM anahtarları bul, aralarından EN UZUN (en spesifik) olanı seç.
    // Bu önemli: "tarif" (genel) ile "menemen" (özel) ikisi de eşleşirse, "tarif" gibi kısa/genel
    // bir kelimenin daha spesifik "menemen" cevabını gölgelememesi gerekir - en uzun eşleşme kazanır.
    let enIyiAnahtar = null;
    let enIyiUzunluk = -1;
    for (const anahtarKelime in aktifHavuz) {
        const anahtarBosluksuz = bosluksuz(anahtarKelime);
        if (anahtarMetindeVarMi(kucukHarfText, kucukHarfTextBosluksuz, anahtarKelime, anahtarBosluksuz, false) && anahtarBosluksuz.length > enIyiUzunluk) {
            enIyiAnahtar = anahtarKelime;
            enIyiUzunluk = anahtarBosluksuz.length;
        }
    }
    if (enIyiAnahtar !== null) {
        return aktifHavuz[enIyiAnahtar];
    }

    // 2. AŞAMA: Tam eşleşme bulunamadıysa, yazım hatasına toleranslı ara (yine en uzun eşleşme kazanır).
    enIyiAnahtar = null;
    enIyiUzunluk = -1;
    for (const anahtarKelime in aktifHavuz) {
        const anahtarBosluksuz = bosluksuz(anahtarKelime);
        if (anahtarMetindeVarMi(kucukHarfText, kucukHarfTextBosluksuz, anahtarKelime, anahtarBosluksuz, true) && anahtarBosluksuz.length > enIyiUzunluk) {
            enIyiAnahtar = anahtarKelime;
            enIyiUzunluk = anahtarBosluksuz.length;
        }
    }
    if (enIyiAnahtar !== null) {
        return aktifHavuz[enIyiAnahtar];
    }

    // Aktif dilde bulunamadı; İngilizce sorulduysa ve TR havuzunda varsa bunu da dene
    // (bazı konular henüz İngilizce'ye çevrilmedi, en azından Türkçe cevabı görsün diye değil -
    // yalnızca kullanıcıyı bilgilendiren nazik bir mesaj döndürüyoruz)
    return dil === 'en' ? kurtariciCevapEN : kurtariciCevap;
}

        // 3. İNSANSI YAZMA EFEKTİ (HARF HARF BASMA)
        function typeWriterEffect(text) {
            const chatBox = document.getElementById("chatBox");
            const messageDiv = document.createElement("div");
            
            messageDiv.classList.add("message", "bot-message");
            chatBox.appendChild(messageDiv);
            
            let i = 0;
            const speed = 20; // Ne kadar düşük o kadar hızlı yazar
            
            function type() {
                if (i < text.length) {
                    messageDiv.textContent += text.charAt(i);
                    i++;
                    chatBox.scrollTop = chatBox.scrollHeight;
                    setTimeout(type, speed);
                }
            }
            
            type();
        }
    </script>
